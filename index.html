let currentIndex = 0;
let typing = false;
let typingTimer = null;

const menu = document.getElementById("menu");
const story = document.getElementById("story");
const ending = document.getElementById("ending");

const character = document.getElementById("character");
const storyText = document.getElementById("storyText");
const progress = document.getElementById("progress");


function startChapter() {

    currentIndex = 0;

    menu.style.display = "none";
    story.style.display = "block";
    ending.style.display = "none";

    showText();
}


function showText() {

    clearInterval(typingTimer);

    const data = chapter1[currentIndex];

    character.innerText = data.character;
    storyText.innerText = "";

    progress.innerText =
        (currentIndex + 1) + " / " + chapter1.length;

    let i = 0;
    typing = true;

    typingTimer = setInterval(function() {

        storyText.innerText += data.text.charAt(i);
        i++;

        if (i >= data.text.length) {

            clearInterval(typingTimer);
            typing = false;

        }

    }, 25);
}


function nextText() {

    /*
    글자가 아직 출력되는 중이면
    버튼을 한 번 눌렀을 때 바로 완성
    */
    if (typing) {

        clearInterval(typingTimer);

        storyText.innerText =
            chapter1[currentIndex].text;

        typing = false;

        return;
    }

    currentIndex++;

    if (currentIndex >= chapter1.length) {

        story.style.display = "none";
        ending.style.display = "flex";

        return;
    }

    showText();
}


function backToMenu() {

    clearInterval(typingTimer);

    typing = false;

    story.style.display = "none";
    ending.style.display = "none";
    menu.style.display = "flex";
}


/* 키보드 */

document.addEventListener("keydown", function(event) {

    if (story.style.display !== "block") {
        return;
    }

    if (
        event.code === "Space" ||
        event.code === "Enter"
    ) {

        event.preventDefault();
        nextText();

    }

    if (event.code === "Escape") {

        backToMenu();

    }

            )();

        );

        );

        const textElement =

            });
